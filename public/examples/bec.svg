<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" role="img" aria-label="Ukážka podvodného e-mailu od falošného riaditeľa so žiadosťou o platbu" xmlns:c2pa="http://c2pa.org/manifest"><rect x="0" y="0" width="800" height="550" rx="16" fill="#eef1f5" /><rect x="40" y="60" width="720" height="470" rx="12" fill="#fff" stroke="#d9dde3" stroke-width="1" /><text x="68" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Urgentná úhrada – dôverné</text><circle cx="86" cy="142" r="18" fill="#dbeafe"/><text x="86" y="147" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#1b4ea0" text-anchor="middle" >R</text><text x="114" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start" >Riaditeľ úradu</text><text x="114" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" >&lt;riaditel@vicepremier-gov.sk&gt;</text><rect x="108" y="144" width="222" height="22" rx="6" fill="none" stroke="#d4351c" stroke-width="2" stroke-dasharray="6 4"/><circle cx="348" cy="155" r="14" fill="#d4351c" stroke="#fff" stroke-width="2.5"/><text x="348" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >1</text><text x="732" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="end" >dnes 16:52</text><line x1="60" y1="182" x2="740" y2="182" stroke="#d9dde3" stroke-width="1" /><text x="68" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >Dobrý deň,</text><text x="68" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >potrebujem, aby ste ešte dnes vybavili úhradu faktúry novému dodávateľovi.</text><text x="68" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start" >Ide o dôvernú záležitosť, zatiaľ o tom nikomu nehovorte.</text><rect x="62" y="260" width="470" height="26" rx="6" fill="none" stroke="#d4351c" stroke-width="2" stroke-dasharray="6 4"/><circle cx="552" cy="273" r="14" fill="#d4351c" stroke="#fff" stroke-width="2.5"/><text x="552" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >2</text><text x="68" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start" >Som na rokovaní, nevolajte mi – len potvrďte e-mailom, keď to bude hotové.</text><rect x="62" y="290" width="640" height="26" rx="6" fill="none" stroke="#d4351c" stroke-width="2" stroke-dasharray="6 4"/><circle cx="720" cy="303" r="14" fill="#d4351c" stroke="#fff" stroke-width="2.5"/><text x="720" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >3</text><rect x="68" y="332" width="420" height="98" rx="8" fill="#f8fafc" stroke="#d9dde3" stroke-width="1" /><text x="86" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" >Suma:</text><text x="190" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >18 450,00 €</text><text x="86" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" >IBAN:</text><text x="190" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >SK12 0000 0000 0012 3456 7890</text><text x="86" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" >Príjemca:</text><text x="190" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >ALFA PROJEKT s.r.o. (nový účet)</text><rect x="62" y="326" width="432" height="110" rx="6" fill="none" stroke="#d4351c" stroke-width="2" stroke-dasharray="6 4"/><circle cx="514" cy="380" r="14" fill="#d4351c" stroke="#fff" stroke-width="2.5"/><text x="514" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >4</text><text x="68" y="464" font-family="-apple-system, BlinkMacSystemFont, 'Segoe U