oto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start" font-style="italic">láskavo pomôcť?“</text><rect x="163" y="232" width="226" height="136" rx="12" fill="#fff" stroke="#d9dde3" stroke-width="1" /><circle cx="191" cy="262" r="14" fill="#d4351c" stroke="#fff" stroke-width="2.5"/><text x="191" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >4</text><text x="215" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="700" fill="#1b4ea0" text-anchor="start" >Strach</text><line x1="181" y1="286" x2="371" y2="286" stroke="#d9dde3" stroke-width="1" /><text x="181" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start" font-style="italic">„Inak vám zablokujeme</text><text x="181" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start" font-style="italic">účet.“</text><rect x="410" y="232" width="226" height="136" rx="12" fill="#fff" stroke="#d9dde3" stroke-width="1" /><circle cx="438" cy="262" r="14" fill="#d4351c" stroke="#fff" stroke-width="2.5"/><text x="438" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >5</text><text x="462" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="700" fill="#1b4ea0" text-anchor="start" >Zvedavosť</tex