<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" role="img" aria-label="Ukážka chatovej konverzácie s falošným audítorom" xmlns:c2pa="http://c2pa.org/manifest"><rect x="0" y="0" width="800" height="580" rx="16" fill="#eef1f5" /><rect x="40" y="60" width="720" height="500" rx="12" fill="#fff" stroke="#d9dde3" stroke-width="1" /><circle cx="86" cy="100" r="20" fill="#c7d2fe"/><text x="86" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#1b4ea0" text-anchor="middle" >MK</text><text x="116" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start" >Martin Kováč</text><rect x="224" y="82" width="64" height="20" rx="10" fill="#fef3c7" /><text x="256" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle" >Externý</text><text x="116" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start" >Audit kybernetickej bezpečnosti</text><rect x="60" y="74" width="244" height="52" rx="6" fill="none" stroke="#d4351c" stroke-width="2" stroke-dasharray="6 4"/><circle cx="324" cy="100" r="14" fill="#d4351c" stroke="#fff" stroke-width="2.5"/><text x="324" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >1</text><line x1="40" y1="140" x2="760" y2="140" stroke="#d9dde3" stroke-width="1" /><rect x="64" y="160" width="500" height="81" rx="14" fill="#ffffff" stroke="#d9dde3" stroke-width="1" /><text x="80" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" >Dobrý deň, pani Nováková. Som z audítorskej spoločnosti,</text><text x="80" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" >robíme kontrolu kybernetickej bezpečnosti pre váš odbor</text><text x="80" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" >rozpočtu a projektového riadenia.</text><circle cx="586" cy="200.5" r="14" fill="#d4351c" stroke="#fff" stroke-width="2.5"/><text x="586" y="205.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >3</text><rect x="64" y="251" width="500" height="60" rx="14" fill="#ffffff" stroke="#d9dde3" stroke-width="1" /><text x="80" y="277" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" >Pán riaditeľ vás o tom určite informoval,</text><text x="80" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" >termín máme do piatku.</text><circle cx="586" cy="281.0" r="14" fill="#d4351c" stroke="#fff" stroke-width="2.5"/><text x="586" y="286.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >2</text><rect x="406" y="321" width="330" height="39" rx="14" fill="#1b4ea0" /><text x="422" y="347" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#ffffff" text-anchor="start" >O audite som počula, podrobnosti nemám.</text><rect x="64" y="370" width="500" height="81" rx="14" fill="#ffffff" stroke="#d9dde3" stroke-width="1" /><text x="80" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" >Nevadí. Potrebujem len zoznam používateľských účtov</text><text x="80" y="417" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" >vášho oddelenia a dočasný prístup do VPN. Pošlite mi</text><text x="80" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" >to sem, prosím, je to súrne.</text><circle cx="586" cy="410.5" r="14" fill="#d4351c" stroke="#fff" stroke-width="2.5"/><text x="586" y="415.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >4</text><rect x="60" y="502" width="680" height="40" rx="20" fill="#fff" stroke="#d9dde3" stroke-width="1" /><text x="80" y="527" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#9ca3af" text-anchor="start" >Napísať správu…</text><rect x="672" y="16" width="108" height="28" rx="14" fill="#fff" stroke="#d9dde3" stroke-width="1" /><text x="726" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle" letter-spacing="1.5">UKÁŽKA</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>