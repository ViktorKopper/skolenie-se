# vhost pre nginx-rp – skopírovať do konfigurácie kontajnera nginx-rp
# certifikát z AD CS: /etc/nginx/certs/lms.uppvl.sk.crt (+ reťazec CA), kľúč: /etc/nginx/certs/lms.uppvl.sk.key

server {
    listen 80;
    server_name lms.uppvl.sk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name lms.uppvl.sk;

    ssl_certificate     /etc/nginx/certs/lms.uppvl.sk.crt;
    ssl_certificate_key /etc/nginx/certs/lms.uppvl.sk.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;   # nahrávanie obrázkov v admine

    # DOČASNE počas prvého nastavenia (vytvorenie admina, seed) – potom tieto 2 riadky zmaž a reload
    allow 10.40.6.23;
    deny all;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass         http://10.40.6.39:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
