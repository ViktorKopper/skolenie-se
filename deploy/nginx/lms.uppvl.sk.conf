# /etc/nginx/conf.d/lms.uppvl.sk.conf na rpuppvl
# certifikát z AD CS (server + UPPVL-CA-DC01): /etc/nginx/ssl/lms.uppvl.sk.crt, kľúč: /etc/nginx/ssl/lms.uppvl.sk.key

server {
    listen 80;
    server_name lms.uppvl.sk;

    return 301 https://$host$request_uri;
}

server {
    include conf.d/nginx-maint/maintenance.conf;
    listen 443 ssl;
    server_name lms.uppvl.sk;

    ssl_certificate     /etc/nginx/ssl/lms.uppvl.sk.crt;
    ssl_certificate_key /etc/nginx/ssl/lms.uppvl.sk.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # DOČASNE len admin (kým nie je prvé prihlásenie a seed) – potom odkomentuj siete a zmaž riadok s 10.40.6.23
    allow 10.40.6.23;
    # allow 10.40.0.0/16;
    # allow 10.20.0.0/16;
    # allow 10.100.3.0/24;
    deny all;

    client_max_body_size 20m;   # nahrávanie obrázkov v /admin

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://10.40.6.39:3010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
