# Produkcia na hoste "services". Image zostaví GitHub Actions do ghcr.io (pozri DEPLOY.md).
#   docker compose --env-file .env.production -f docker-compose.prod.yml pull
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d
name: skolenie-se

services:
  app:
    # IMAGE_TAG v .env.production: latest alebo konkrétny commit (sha-xxxxxxx) na rollback
    image: ghcr.io/viktorkopper/skolenie-se:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://payload:${POSTGRES_PASSWORD:?nastav POSTGRES_PASSWORD v .env.production}@db:5432/skolenie_se
      LDAP_CA_FILE: /app/certs/ca.cer
    ports:
      - '3010:3000' # nginx-rp → http://10.40.6.39:3010
    volumes:
      - media:/app/media
      - ./deploy/UPPVL-CA-chain.pem:/app/certs/ca.cer:ro # koreňová CA pre LDAPS
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: skolenie_se
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?nastav POSTGRES_PASSWORD v .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d skolenie_se']
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
  media:
